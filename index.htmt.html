<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passive Voice MCQ Battle</title><style>*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial,sans-serif;background:linear-gradient(135deg,#e9f7ff,#fff1fa,#fff7d9);color:#233353}.wrap{max-width:1080px;margin:auto;padding:22px}h1{text-align:center;font-size:clamp(30px,5vw,55px);margin:10px 0}header p{text-align:center;font-size:19px}.teams{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.team{background:white;border:3px solid transparent;border-radius:20px;padding:15px 6px;text-align:center;cursor:pointer;box-shadow:0 6px 18px #20305018;font-size:17px}.team.active{border-color:#435bd6;transform:translateY(-3px)}.team b{display:block;font-size:26px;margin-top:5px}.panel{background:#fff;border-radius:25px;padding:25px;box-shadow:0 12px 30px #20305020}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{background:#edf2ff;border-radius:30px;padding:10px 16px;font-weight:bold}.timer{font-size:26px;color:#d44369}.question{font-size:clamp(21px,3vw,30px);font-weight:bold;margin:20px 0}.options{display:grid;grid-template-columns:1fr 1fr;gap:13px}.option{min-height:90px;border:3px solid #d9e3fa;background:#f9fbff;border-radius:18px;padding:15px;text-align:left;font-size:clamp(16px,2vw,21px);cursor:pointer;color:#233353}.option:hover:not(:disabled){background:#eaf1ff}.option:disabled{cursor:default}.option.correct{background:#d9f8e4;border-color:#25ad65}.option.wrong{background:#ffe1e7;border-color:#e35b7b}.feedback{min-height:62px;font-size:20px;font-weight:bold;margin-top:16px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:14px;background:#5567dd;color:white;padding:13px 20px;font-size:17px;font-weight:bold;cursor:pointer}.btn.secondary{background:#ed739d}.btn:disabled{opacity:.45;cursor:default}.progress{height:12px;background:#e7eafb;border-radius:20px;overflow:hidden;margin:16px 0}.bar{height:100%;background:#64c9a4;transition:width .3s}.hint{font-size:17px;color:#7b4a0e}.foot{text-align:center;margin-top:15px;color:#6b7387}@media(max-width:650px){.teams{grid-template-columns:1fr 1fr}.options{grid-template-columns:1fr}.panel{padding:17px}}</style></head><body><div class="wrap"><header><h1>🎉 PASSIVE VOICE MCQ BATTLE! 🏆</h1><p>Grade 9 • 4 teams • 6 challenges • 60 seconds per question</p></header><div class="teams" id="teams"></div><main class="panel"><div class="top"><span class="pill" id="count">Question 1 of 6</span><span class="pill" id="turn">Choose a team!</span><span class="pill timer" id="clock">⏰ 60s</span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div class="options" id="options"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="controls"><button class="btn" id="start">▶ Start timer</button><button class="btn secondary" id="hint">💡 Hint</button><button class="btn" id="next" disabled>Next question ➜</button><button class="btn secondary" id="reset">↻ Restart</button></div><p class="hint" id="hintText"></p></main><p class="foot">Tap a team before answering. +10 for a correct answer, +5 bonus if 30+ seconds remain! 🌟</p></div><script>
const questions=[
{q:'I checked the recipe many times.',a:['The recipe is checked many times.','The recipe was checked many times.','The recipe were checked many times.','The recipe will be checked many times.'],c:1,h:'Past simple passive: was/were + past participle.',why:'“Checked” is past simple; “the recipe” is singular, so use “was checked”.'},
{q:'The contestant can drive this fast car.',a:['This fast car can driven by the contestant.','This fast car is driven by the contestant.','This fast car can be driven by the contestant.','This fast car was driven by the contestant.'],c:2,h:'Modal passive: can + be + past participle.',why:'After “can”, use “be driven”.'},
{q:'The government builds many new schools every year.',a:['Many new schools are built every year.','Many new schools is built every year.','Many new schools were built every year.','Many new schools are build every year.'],c:0,h:'Present simple passive: am/is/are + past participle.',why:'“Schools” is plural, so use “are built”.'},
{q:'They distributed the books quite late this year.',a:['The books are distributed quite late this year.','The books was distributed quite late this year.','The books were distribute quite late this year.','The books were distributed quite late this year.'],c:3,h:'Past simple passive: was/were + past participle.',why:'“Books” is plural and “distributed” is past simple: “were distributed”.'},
{q:'We will start a charity organization next month.',a:['A charity organization will started next month.','A charity organization will be started next month.','A charity organization is started next month.','A charity organization was started next month.'],c:1,h:'Future passive: will + be + past participle.',why:'“Will start” becomes “will be started”.'},
{q:'She arranges beautiful flower bouquets in the shop.',a:['Beautiful flower bouquets is arranged in the shop.','Beautiful flower bouquets were arranged in the shop.','Beautiful flower bouquets are arranged in the shop.','Beautiful flower bouquets are arrange in the shop.'],c:2,h:'Present simple passive: am/is/are + past participle.',why:'“Bouquets” is plural, so use “are arranged”.'}];
const teams=[{name:'Ruby',emoji:'❤️',score:0},{name:'Pearl',emoji:'🦪',score:0},{name:'Emerald',emoji:'💚',score:0},{name:'Diamond',emoji:'💎',score:0}];let selected=0,index=0,seconds=60,interval=null,started=false,answered=false;
const el=id=>document.getElementById(id);function drawTeams(){el('teams').innerHTML=teams.map((t,i)=>`<button class="team ${i===selected?'active':''}" onclick="pick(${i})">${t.emoji} ${t.name}<b>${t.score} pts</b></button>`).join('');el('turn').textContent='🎯 '+teams[selected].name+' is playing';}function pick(i){if(started&&!answered)return;selected=i;drawTeams();}function clock(){el('clock').textContent='⏰ '+seconds+'s';}function stop(){clearInterval(interval);interval=null;}function show(){stop();started=false;answered=false;seconds=60;clock();drawTeams();el('count').textContent='Question '+(index+1)+' of '+questions.length;el('bar').style.width=((index)/questions.length*100)+'%';el('question').textContent='Change into passive voice: “'+questions[index].q+'”';el('options').innerHTML=questions[index].a.map((a,i)=>`<button class="option" data-i="${i}" onclick="choose(${i})"><strong>${'ABCD'[i]}.</strong> ${a}</button>`).join('');el('feedback').textContent='Choose a team, then start the timer! 🚀';el('hintText').textContent='';el('start').disabled=false;el('next').disabled=true;el('next').textContent=index===questions.length-1?'🏆 See results':'Next question ➜';}function start(){if(started||answered)return;started=true;el('start').disabled=true;el('feedback').textContent='⏳ Think fast! Pick the correct sentence!';interval=setInterval(()=>{seconds--;clock();if(seconds<=0){stop();finish(-1);}},1000);}function choose(i){if(!started||answered)return;finish(i);}function finish(i){if(answered)return;answered=true;started=false;stop();const q=questions[index],good=i===q.c;document.querySelectorAll('.option').forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('correct');if(j===i&&!good)b.classList.add('wrong');});if(good){const pts=10+(seconds>=30?5:0);teams[selected].score+=pts;el('feedback').textContent=`🎊 AMAZING, ${teams[selected].name}! +${pts} points! ${q.why}`;}else{el('feedback').textContent=(i<0?'⌛ Time is up! ':'🙈 Oops! Try the next one! ')+q.why;}drawTeams();el('next').disabled=false;el('bar').style.width=((index+1)/questions.length*100)+'%';}function next(){if(!answered)return;if(index<questions.length-1){index++;selected=(selected+1)%4;show();}else{const max=Math.max(...teams.map(t=>t.score));const winners=teams.filter(t=>t.score===max).map(t=>t.emoji+' '+t.name).join(' & ');el('question').textContent='🏆 GAME OVER!';el('options').innerHTML='';el('feedback').textContent='🎉 Winner: '+winners+' with '+max+' points! Great job, everyone!';el('count').textContent='All 6 challenges completed';el('next').disabled=true;el('start').disabled=true;el('hint').disabled=true;stop();}}function reset(){stop();teams.forEach(t=>t.score=0);index=0;selected=0;el('hint').disabled=false;show();}el('start').onclick=start;el('next').onclick=next;el('reset').onclick=reset;el('hint').onclick=()=>el('hintText').textContent='💡 '+questions[index].h;show();
</script></body></html>
